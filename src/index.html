<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>puzpy viewer</title>
<link rel="stylesheet" href="static/styles.css">
<script type="module" src="static/main.js" defer></script>
</head>
<body>

<h1>Crossword Grid</h1>



<div class="toolbar">
  <span>Mode:</span>
  <button class="active" id="btn-fill" onclick="setMode('fill')">Fill letters</button>
  <button id="btn-block" onclick="setMode('block')">Toggle black squares</button>
  <button onclick="clearLetters()">Clear letters</button>
  <button onclick="clearAll()">Clear all</button>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>
<div id="hint">Click a white square to start typing. Arrow keys to navigate</div>
</body>
</html>
