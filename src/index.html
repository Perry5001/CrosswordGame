<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>

<div id="lobby">
    <div class="lobby-card">
        <div class="title">
            <h1>Crossword Gameified</h1>
            <h2>Compete against your friends as you complete a crossword!</h2>
        </div>
        
        <section class="lobby-section">
            <label>Start a new game</label>
            <button id="hostBtn" style="width:100%; padding:10px; font-size:14px; font-weight:600; border-radius:8px;">
                Create Game
            </button>
        </section>

        <div class="divider">or</div>

        <section class="lobby-section">
            <label>Join a game</label>
            <div class="row">
                <input type="text" id="codeInput" placeholder="Enter game code" maxlength="20" autocomplete="off">
                <button id="joinBtn">Join</button>
            </div>
            <span id="joinError" class="status-text" style="color:#c0392b;"></span>
        </section>
    </div>
</div>

<style>
    .divider {
        text-align: center;
        font-size: 12px;
        color: #bbb;
        margin: -8px 0 22px;
        position: relative;
    }
    .divider::before, .divider::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 42%;
        height: 0.5px;
        background: #e0e0e0;
    }
    .divider::before { left: 0; }
    .divider::after  { right: 0; }
</style>

<script>
    document.getElementById('hostBtn').addEventListener('click', () => {
        window.location.href = '/host';
    });

    function joinGame() {
        const code = document.getElementById('codeInput').value.trim();
        if (!code) {
            document.getElementById('joinError').textContent = 'Please enter a game code.';
            return;
        }
        window.location.href = `/guest?id=${encodeURIComponent(code)}`;
    }

    document.getElementById('joinBtn').addEventListener('click', joinGame);
    document.getElementById('codeInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') joinGame();
    });
</script>

</body>
</html>
