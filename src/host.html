<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Host</title>
    <link rel="stylesheet" href="static/styles.css">
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <script type="module" src="static/host.js" defer></script>
</head>
<body>

<!-- ── LOBBY ─────────────────────────────────────────────────── -->
<div id="lobby">
    <div class="lobby-card">
        <h1>🧩 Crossword</h1>

        <section class="lobby-section">
            <label>Your name</label>
            <div class="row">
                <input type="text" id="hostUsername" placeholder="Enter your name" maxlength="20">
                <button id="setUsernameBtn">Set</button>
            </div>
            <span id="usernameStatus" class="status-text"></span>
        </section>

        <section class="lobby-section">
            <label>Upload puzzle</label>
            <div class="row">
                <input type="file" id="fileInput" accept=".puz">
            </div>
            <span id="upload-status" class="status-text"></span>
        </section>

        <section class="lobby-section">
            <label>Invite link</label>
            <div id="peer-id" class="status-text">Connecting…</div>
        </section>

        <section class="lobby-section">
            <label>Players <span id="player-count">(0)</span></label>
            <ul id="player-list"></ul>
        </section>

        <button id="startBtn" disabled>Start Game</button>
    </div>
</div>

<!-- ── GAME ──────────────────────────────────────────────────── -->
<div id="game" style="display:none;">
    <div class="header">
        <h1 id="puzzle-title">Crossword</h1>
        <div id="game-peer-id" style="font-size:0.8em;"></div>
        <ol id="scoreboard" style="list-style:none; padding: 0 2rem 0.5rem;"></ol>
    </div>

    <div class="grid-wrap">
        <div class="grid" id="grid"></div>
        <div class="clues">
            <div class="across">
                <h2>Across</h2>
                <ol id="acrossList"></ol>
            </div>
            <div class="down">
                <h2>Down</h2>
                <ol id="downList"></ol>
            </div>
        </div>
    </div>

    <div id="hint">Click a white square to start typing. Arrow keys to navigate.</div>
</div>

</body>
</html>
