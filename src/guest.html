<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Guest</title>
    <link rel="stylesheet" href="static/styles.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script type="module" src="static/guest.js" defer></script>
</head>
<body>

<!-- ── LOBBY ─────────────────────────────────────────────────── -->
<div id="lobby">
    <div class="lobby-card">
        <div class="title">
            <h1>Crossword Gameified</h1>
            <h2>Compete against your friends as you complete a crossword!</h2>
        </div>

        <section class="lobby-section">
            <label>Your name</label>
            <div class="row">
                <input type="text" id="guestUsername" placeholder="Enter your name" maxlength="20">
                <button id="setUsernameBtn">Set</button>
            </div>
            <span id="usernameStatus" class="status-text"></span>
        </section>

        <section class="lobby-section">
            <label>Status</label>
            <div id="log" class="status-text">Connecting…</div>
        </section>

        <section class="lobby-section">
            <label>Players</label>
            <ul id="player-list"></ul>
        </section>

        <p class="waiting-text">Waiting for host to start the game…</p>
    </div>
</div>

<!-- ── GAME ──────────────────────────────────────────────────── -->
<div id="game" style="display:none;">
    <div class="header">
        <h1 id="puzzle-title">Crossword</h1>
        <ol id="scoreboard" style="list-style:none; padding: 0 2rem 0.5rem;"></ol>
    </div>

    <div class="grid-wrap">
        <div class="grid" id="grid"></div>
        <div class="clues">
            <div class="across">
                <h2>Across</h2>
                <ol id="acrossList"></ol>
            </div>
            <div class="down">
                <h2>Down</h2>
                <ol id="downList"></ol>
            </div>
        </div>
    </div>

    <div id="hint">Click a white square to start typing. Arrow keys to navigate.</div>
</div>

</body>
</html>
