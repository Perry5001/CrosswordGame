<!DOCTYPE html>
<html>
<head>
    <title>PeerJS Test</title>
</head>
<body>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const peer = new Peer();

peer.on('open', id => {
    console.log("My ID:", id);
});

peer.on('connection', conn => {
    conn.on('data', data => console.log("Received:", data));
});
</script>
</body>
</html>
