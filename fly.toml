app = "crossword-game"        # change to your preferred app name
primary_region = "ord"        # Chicago — closest to Round Lake, IL

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1