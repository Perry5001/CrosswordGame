<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossword Grid</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f4f0;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 1.5rem;
      letter-spacing: -0.3px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label {
      font-size: 13px;
      color: #666;
    }

    input[type=number] {
      width: 56px;
      text-align: center;
      font-size: 14px;
      padding: 5px 8px;
      border: 0.5px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }

    .dim-sep { font-size: 16px; color: #aaa; }

    button {
      font-size: 13px;
      padding: 6px 14px;
      border: 0.5px solid #bbb;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      transition: background 0.12s;
    }

    button:hover { background: #eee; }
    button:active { transform: scale(0.98); }
    button.active { background: #e8e8e8; border-color: #999; }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .toolbar span {
      font-size: 12px;
      color: #888;
    }

    .grid-wrap { overflow: auto; margin-bottom: 1rem; }

    .grid {
      display: inline-grid;
      border: 2px solid #1a1a1a;
      gap: 0;
    }

    .cell {
      width: 40px;
      height: 40px;
      position: relative;
      border: 1px solid #ccc;
      background: #fff;
    }

    .cell.black { background: #1a1a1a; cursor: pointer; }
    .cell.black:hover { background: #333; }
    .cell.white { cursor: text; }
    .cell.white:hover { background: #f0f0f0; }
    .cell.focused { background: #b5d4f4 !important; }
    .cell.word-highlight { background: #ddeeff; }

    .cell-num {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 8px;
      line-height: 1;
      color: #555;
      font-weight: 500;
      pointer-events: none;
      z-index: 1;
    }

    .cell input {
      position: absolute;
      inset: 0;
      border: none;
      outline: none;
      background: transparent;
      text-align: center;
      font-family: inherit;
      font-size: 18px;
      font-weight: 500;
      color: #1a1a1a;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
      padding-top: 8px;
    }

    #hint {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<h1>Crossword Grid</h1>

<div class="controls">
  <div class="control-group">
    <label>Columns</label>
    <input type="number" id="cols" min="2" max="30" value="13">
  </div>
  <span class="dim-sep">×</span>
  <div class="control-group">
    <label>Rows</label>
    <input type="number" id="rows" min="2" max="30" value="13">
  </div>
  <button onclick="buildGrid()">Apply</button>
</div>

<div class="toolbar">
  <span>Mode:</span>
  <button class="active" id="btn-fill" onclick="setMode('fill')">Fill letters</button>
  <button id="btn-block" onclick="setMode('block')">Toggle black squares</button>
  <button onclick="clearLetters()">Clear letters</button>
  <button onclick="clearAll()">Clear all</button>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>
<div id="hint">Click a white square to start typing. Arrow keys to navigate.</div>

<script>
  let rows = 13, cols = 13;
  let cells = [];
  let mode = 'fill';
  let focusedR = -1, focusedC = -1;
  let direction = 'across';

  function setMode(m) {
    mode = m;
    document.getElementById('btn-fill').classList.toggle('active', m === 'fill');
    document.getElementById('btn-block').classList.toggle('active', m === 'block');
    document.getElementById('hint').textContent = m === 'fill'
      ? 'Click a white square to start typing. Arrow keys to navigate. Arrow key direction sets across/down.'
      : 'Click any square to toggle it black/white. Black squares create word boundaries.';
  }

  function buildGrid() {
    rows = Math.min(30, Math.max(2, parseInt(document.getElementById('rows').value) || 13));
    cols = Math.min(30, Math.max(2, parseInt(document.getElementById('cols').value) || 13));
    document.getElementById('rows').value = rows;
    document.getElementById('cols').value = cols;

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = `repeat(${cols}, 40px)`;
    cells = [];
    focusedR = -1; focusedC = -1;

    for (let r = 0; r < rows; r++) {
      cells[r] = [];
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell white';
        cell.dataset.r = r;
        cell.dataset.c = c;

        const numEl = document.createElement('div');
        numEl.className = 'cell-num';
        cell.appendChild(numEl);

        const inp = document.createElement('input');
        inp.type = 'text';
        inp.maxLength = 2;
        inp.setAttribute('autocomplete', 'off');
        inp.addEventListener('keydown', e => onKey(e, r, c));
        inp.addEventListener('input', e => onInput(e, inp, r, c));
        inp.addEventListener('focus', () => onFocus(r, c));
        cell.appendChild(inp);

        cell.addEventListener('mousedown', e => onCellClick(e, r, c));
        grid.appendChild(cell);
        cells[r][c] = { div: cell, inp, isBlack: false, num: numEl };
      }
    }
    numberCells();
  }

  function onCellClick(e, r, c) {
    if (mode === 'block') {
      e.preventDefault();
      toggleBlack(r, c);
      return;
    }
    if (cells[r][c].isBlack) { e.preventDefault(); return; }
    if (focusedR === r && focusedC === c) {
      direction = direction === 'across' ? 'down' : 'across';
      highlightWord(r, c);
    }
  }

  function toggleBlack(r, c) {
    const cell = cells[r][c];
    cell.isBlack = !cell.isBlack;
    cell.div.className = 'cell ' + (cell.isBlack ? 'black' : 'white');
    cell.inp.disabled = cell.isBlack;
    cell.inp.value = '';
    numberCells();
    highlightWord(focusedR, focusedC);
  }

  function onFocus(r, c) {
    focusedR = r; focusedC = c;
    highlightWord(r, c);
  }

  function highlightWord(r, c) {
    for (let rr = 0; rr < rows; rr++)
      for (let cc = 0; cc < cols; cc++)
        cells[rr][cc].div.classList.remove('focused', 'word-highlight');
    if (r < 0 || c < 0) return;
    cells[r][c].div.classList.add('focused');
    if (direction === 'across') {
      let start = c;
      while (start > 0 && !cells[r][start - 1].isBlack) start--;
      let end = c;
      while (end < cols - 1 && !cells[r][end + 1].isBlack) end++;
      for (let cc = start; cc <= end; cc++)
        if (cc !== c) cells[r][cc].div.classList.add('word-highlight');
    } else {
      let start = r;
      while (start > 0 && !cells[start - 1][c].isBlack) start--;
      let end = r;
      while (end < rows - 1 && !cells[end + 1][c].isBlack) end++;
      for (let rr = start; rr <= end; rr++)
        if (rr !== r) cells[rr][c].div.classList.add('word-highlight');
    }
  }

  function onInput(e, inp, r, c) {
    let val = inp.value.replace(/[^a-zA-Z]/g, '');
    if (val.length > 1) val = val[val.length - 1];
    inp.value = val.toUpperCase();
    if (val.length === 1) advance(r, c);
  }

  function onKey(e, r, c) {
    if (e.key === 'ArrowRight') { e.preventDefault(); direction = 'across'; move(r, c, 0, 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); direction = 'across'; move(r, c, 0, -1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); direction = 'down'; move(r, c, 1, 0); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); direction = 'down'; move(r, c, -1, 0); }
    else if (e.key === 'Backspace') {
      if (cells[r][c].inp.value === '') { e.preventDefault(); retreat(r, c); }
    } else if (e.key === 'Tab') {
      e.preventDefault();
      advanceWord(r, c, e.shiftKey ? -1 : 1);
    }
  }

  function move(r, c, dr, dc) {
    let nr = r + dr, nc = c + dc;
    while (nr >= 0 && nr < rows && nc >= 0 && nc < cols && cells[nr][nc].isBlack) {
      nr += dr; nc += dc;
    }
    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
      cells[nr][nc].inp.focus();
      cells[nr][nc].inp.select();
    }
  }

  function advance(r, c) {
    if (direction === 'across') move(r, c, 0, 1);
    else move(r, c, 1, 0);
  }

  function retreat(r, c) {
    const dr = direction === 'down' ? -1 : 0;
    const dc = direction === 'across' ? -1 : 0;
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !cells[nr][nc].isBlack) {
      cells[nr][nc].inp.value = '';
      cells[nr][nc].inp.focus();
    }
  }

  function advanceWord(r, c, step) {
    let nr = r, nc = c;
    if (direction === 'across') {
      nc += step;
      while (nr >= 0 && nr < rows) {
        while (nc >= 0 && nc < cols) {
          if (!cells[nr][nc].isBlack) { cells[nr][nc].inp.focus(); return; }
          nc += step;
        }
        nr += step; nc = step > 0 ? 0 : cols - 1;
      }
    } else {
      nr += step;
      while (nc >= 0 && nc < cols) {
        while (nr >= 0 && nr < rows) {
          if (!cells[nr][nc].isBlack) { cells[nr][nc].inp.focus(); return; }
          nr += step;
        }
        nc += step; nr = step > 0 ? 0 : rows - 1;
      }
    }
  }

  function numberCells() {
    let n = 1;
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) {
        const cell = cells[r][c];
        cell.num.textContent = '';
        if (cell.isBlack) continue;
        const acrossStart = (c === 0 || cells[r][c - 1].isBlack) && (c + 1 < cols && !cells[r][c + 1].isBlack);
        const downStart = (r === 0 || cells[r - 1][c].isBlack) && (r + 1 < rows && !cells[r + 1][c].isBlack);
        if (acrossStart || downStart) cell.num.textContent = n++;
      }
  }

  function clearLetters() {
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        cells[r][c].inp.value = '';
  }

  function clearAll() {
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) {
        const cell = cells[r][c];
        cell.isBlack = false;
        cell.div.className = 'cell white';
        cell.inp.disabled = false;
        cell.inp.value = '';
        cell.num.textContent = '';
      }
    numberCells();
  }

  buildGrid();
</script>
</body>
</html>
